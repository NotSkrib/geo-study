<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #fff;
      color: #202124;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      font-size: 14px;
    }
    
    .header a {
      color: rgba(0,0,0,0.87);
      text-decoration: none;
      margin-left: 26px;
      cursor: pointer;
    }
    
    .header a:hover {
      text-decoration: underline;
      color: #1f1f1f;
    }
    
    .header-right {
      display: flex;
      align-items: center;
    }
    
    .profile-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-left: 26px;
    }
    
    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 200px);
      padding: 20px;
    }
    
    .logo {
      font-size: 92px;
      font-weight: 400;
      color: #4285f4;
      margin-bottom: 24px;
      letter-spacing: 3px;
      font-family: Georgia, serif;
    }
    
    .search-container {
      width: 100%;
      max-width: 584px;
      margin-bottom: 24px;
    }
    
    .search-box {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 24px;
      padding: 12px 16px;
      box-shadow: 0 1px 6px rgba(32,33,36,0.08);
    }
    
    .search-box:hover {
      box-shadow: 0 1px 6px rgba(32,33,36,0.28);
    }
    
    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      padding: 0 12px;
    }
    
    .search-box svg {
      width: 20px;
      height: 20px;
      opacity: 0.5;
      margin-right: 12px;
    }
    
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }
    
    .btn {
      background-color: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      color: #3c4043;
      font-size: 14px;
      padding: 10px 24px;
      cursor: pointer;
      transition: all 0.1s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    
    .btn:hover {
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
      background-color: #f8f9fa;
      border: 1px solid #dadce0;
      color: #202124;
    }
    
    .footer {
      background-color: #f2f2f2;
      padding: 15px 20px;
      font-size: 14px;
      color: #70757a;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
    
    .footer-list {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
    }
    
    .footer-list a {
      color: #70757a;
      text-decoration: none;
    }
    
    .footer-list a:hover {
      color: #4285f4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div></div>
    <div class="header-right">
      <a href="#">Gmail</a>
      <a href="#">Images</a>
      <div class="profile-icon">L</div>
    </div>
  </div>
  
  <div class="main">
    <div class="logo">Google</div>
    <form action="https://www.google.com/search" method="GET" target="_blank" class="search-container">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" name="q" placeholder="Search Google or type a URL" required>
      </div>
      <div class="buttons">
        <button type="submit" class="btn">Google Search</button>
        <button type="submit" name="btnI" class="btn">I'm Feeling Lucky</button>
      </div>
    </form>
  </div>
  
  <div class="footer">
    <div class="footer-list">
      <a href="#">About</a>
      <a href="#">Advertising</a>
      <a href="#">Business</a>
      <a href="#">How Search works</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#" onclick="(async()=>{const r=await fetch('https://cdn.jsdelivr.net/gh/NotSkrib/LABIDK@main/index.html');const w=window.open('','_blank');w?.document.write(await r.text()),w?.document.close()})(); return false;">Settings</a>
    </div>
  </div>
</body>
</html>
