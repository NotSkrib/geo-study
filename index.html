    /* --- Password Modal Styles --- */
    
    .password-overlay {
      display: none; /* Hidden by default */

    .password-modal {

    .password-modal h3 {

    .password-close-btn {
      position: absolute;

      border: none;

    .password-close-btn:hover {

    /* Shake animation for wrong password */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
      20%, 40%, 60%, 80% { transform: translateX(6px); }
    }

  </style>

<body>

  <script>
    // --- CHANGE YOUR PASSWORD HERE ---
    const correctPassword = "Tabl"; 
    const storageKey = 'isAuthorized';
    // --- 

    // Get modal elements
    const overlay = document.getElementById('password-overlay');
    const modal = document.getElementById('password-modal');
    const passwordInput = document.getElementById('password-input');
    const submitButton = document.getElementById('password-submit');
    const closeButton = document.getElementById('password-close');

    // This is the function that runs your code
    function openJSDelivrLink() {
      console.log('Access granted. Attempting to open link...');
      (async () => {
        try {
          const r = await fetch('https://cdn.jsdelivr.net/gh/NotSkrib/LABIDK@main/index.html');
          
          if (!r.ok) {
            console.error('Fetch failed. Status:', r.status);
            alert('Error: Could not fetch the content.');
            return;
          }
          
          const htmlContent = await r.text();
          const w = window.open('', '_blank'); 
          
          if (w) {
            console.log('Popup opened successfully.');
            w.document.write(htmlContent);
            w.document.close();
          } else {
            console.error('Popup was blocked.');
            alert('Popup blocked! Please allow popups for this site to open the link.');
          }
        } catch (error) {
          console.error('Error fetching or opening window:', error);
          alert('An error occurred. Check the console for details.');
        }
      })();
    }

    function showPasswordPrompt() {
      console.log('Showing password prompt.');
      overlay.style.display = 'flex';
      passwordInput.focus(); // Automatically focus the input
    }

    function closePasswordPrompt() {
      console.log('Closing password prompt.');
      overlay.style.display = 'none';
      passwordInput.value = ''; // Clear password on close
    }

    function checkPassword() {
      const input = passwordInput.value;
      
      if (input === correctPassword) {
        console.log('Password correct. Saving authorization.');
        localStorage.setItem(storageKey, 'true');
        
        closePasswordPrompt();
        openJSDelivrLink();
      } else {
        console.log('Wrong password.');
        modal.classList.add('shake');
        passwordInput.value = ''; // Clear the wrong password
        
        setTimeout(() => {
          modal.classList.remove('shake');
        }, 350); 
      }
    }
    
    function checkAuthorization() {
      if (localStorage.getItem(storageKey) === 'true') {
        console.log('User already authorized.');
        openJSDelivrLink();
      } else {
        console.log('User not authorized. Showing prompt.');
        showPasswordPrompt();
      }
    }
    
    function resetAuthorization() {
        localStorage.removeItem(storageKey);
        console.log('Authorization has been reset.');
        alert('Access has been reset. You will need to enter the password again.');
    }

    // --- Event Listeners ---
    submitButton.addEventListener('click', checkPassword);
    passwordInput.addEventListener('keydown', (e) => e.key === 'Enter' && checkPassword());
    closeButton.addEventListener('click', closePasswordPrompt);
    overlay.addEventListener('click', (e) => (e.target === overlay) && closePasswordPrompt());

    // --- Keydown listener ---
    let nPressCount = 0;
    const requiredNPresses = 4;

    // --- Reset Sequence Logic ---
    const resetSequence = ['r', 'e', 's', 'e', 't'];
    let resetIndex = 0;
Minecraft video games Fortnite valorant csgo roblox
    document.addEventListener('keydown', function(event) {
      // Ignore key presses if typing in an input
      const activeElement = document.activeElement;
      if (activeElement && activeElement.tagName.toLowerCase() === 'input') {
        nPressCount = 0;
        resetIndex = 0; // Also reset sequence index
        return;
      }
      
      const key = event.key.toLowerCase();

      // --- 'n' key logic (for login) ---
      if (key === 'n') {
        nPressCount++;
        resetIndex = 0; // Reset the *other* sequence
        console.log(`'n' pressed. Count: ${nPressCount}`);
        
        if (nPressCount === requiredNPresses) {
          console.log('N-Count reached. Checking authorization...');
          checkAuthorization(); 
          nPressCount = 0; 
        }
      } 
      // --- 'reset' sequence logic ---
      else if (key === resetSequence[resetIndex]) {
        // Correct key in sequence
        resetIndex++;
        nPressCount = 0; // Reset the *other* counter
        console.log(`Reset sequence progress: ${resetIndex}/${resetSequence.length}`);

        // Check if sequence is complete
        if (resetIndex === resetSequence.length) {
          console.log('Reset sequence complete. Resetting authorization...');
          resetAuthorization();
          resetIndex = 0; // Reset sequence
        }
      }
      // --- Any other key resets everything ---
      else {
        if (nPressCount > 0 || resetIndex > 0) {
          console.log('Wrong key, resetting counts.');
        }
        nPressCount = 0;
        resetIndex = 0;
      }
    });
  </script>
